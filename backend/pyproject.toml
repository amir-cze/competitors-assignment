[project]
name = "radar"
version = "0.1.0"
description = "Radar: competitor content monitoring for Noma"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "openai>=1.50",
    "apscheduler>=3.10,<4",
    "itsdangerous>=2.2",
    "cryptography>=43",
    "python-dateutil>=2.9",
    "tenacity>=9.0",
    "structlog>=24.4",
    "tldextract>=5.1",
]

[project.optional-dependencies]
js = ["playwright>=1.47"]

[project.scripts]
radar-api = "radar.api.main:run"
radar-worker = "radar.worker:run"
radar-seed = "radar.seed:run"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]  # E501: ruff format wraps code; long prompt/log strings are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
